<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#0f2447"/>
      <stop offset="55%" stop-color="#061024"/>
      <stop offset="100%" stop-color="#02050d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="hull" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="wingEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="thruster" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep-Space Rounded Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Background Stars -->
  <circle cx="14" cy="15" r="1" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="51" cy="13" r="1.2" fill="#fef08a" opacity="0.85"/>
  <circle cx="49" cy="48" r="0.9" fill="#bae6fd" opacity="0.7"/>
  <circle cx="13" cy="46" r="1.1" fill="#5eead4" opacity="0.65"/>

  <!-- Tilted Keplerian Orbit Ring -->
  <ellipse cx="32" cy="31" rx="25" ry="9.5" transform="rotate(-22 32 31)" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="120" opacity="0.85"/>

  <!-- Triple Ion Engine Plumes (Trident Motif) -->
  <path d="M22.5 44 L24.5 57 L26.5 44 Z" fill="url(#thruster)"/>
  <path d="M29.5 45 L32 60 L34.5 45 Z" fill="url(#thruster)"/>
  <path d="M37.5 44 L39.5 57 L41.5 44 Z" fill="url(#thruster)"/>

  <!-- Swept-Wing Trident Spacecraft Hull -->
  <path d="M32 8 C34.5 15 36.8 22.5 39.2 28.5 L55.5 39.5 L53 43.2 L39.5 39.8 L36.5 43.5 L27.5 43.5 L24.5 39.8 L11 43.2 L8.5 39.5 L24.8 28.5 C27.2 22.5 29.5 15 32 8 Z" fill="url(#hull)" stroke="url(#wingEdge)" stroke-width="1" stroke-linejoin="round"/>

  <!-- Inner Wing Panel Accent Lines -->
  <path d="M32 13 L25.5 37.5 M32 13 L38.5 37.5" stroke="#1e293b" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>

  <!-- Biosphere Glass Canopy Domes -->
  <ellipse cx="32" cy="24.5" rx="3.3" ry="5.5" fill="#0f172a" stroke="#7dd3fc" stroke-width="1"/>
  <ellipse cx="31.2" cy="23.2" rx="1.4" ry="2.6" fill="#7dd3fc" opacity="0.55"/>
  <ellipse cx="32" cy="33.2" rx="4.2" ry="3.2" fill="#0f172a" stroke="#5eead4" stroke-width="1"/>

  <!-- 3 Glowing Rear Trident Burner Nozzles -->
  <circle cx="24.5" cy="43.5" r="2.5" fill="#0ea5e9" stroke="#e0f2fe" stroke-width="0.8"/>
  <circle cx="32" cy="44.2" r="2.9" fill="#5eead4" stroke="#ffffff" stroke-width="0.9"/>
  <circle cx="39.5" cy="43.5" r="2.5" fill="#0ea5e9" stroke="#e0f2fe" stroke-width="0.8"/>
</svg>